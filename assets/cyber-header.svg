<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">React Native Developer</title>
  <desc id="desc">Cyber-style profile banner in dark blue, cyan, purple and pink</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#071b2c"/>
      <stop offset="1" stop-color="#120925"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f5d4"/><stop offset="0.5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff4ecd"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#00f5d4" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1070" cy="55" r="145" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>
  <circle cx="100" cy="280" r="170" fill="#00f5d4" opacity=".09" filter="url(#glow)"/>
  <path d="M65 79h80l21 21h116" fill="none" stroke="#00f5d4" stroke-width="2" opacity=".8"/>
  <path d="M935 228h105l20-20h76" fill="none" stroke="#ff4ecd" stroke-width="2" opacity=".8"/>
  <rect x="72" y="61" width="9" height="9" fill="#00f5d4" filter="url(#glow)"/>
  <rect x="1126" y="223" width="9" height="9" fill="#ff4ecd" filter="url(#glow)"/>
  <text x="600" y="128" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="50" font-weight="700" letter-spacing="3">MOBILE DEVELOPER</text>
  <rect x="352" y="154" width="496" height="3" rx="2" fill="url(#accent)" filter="url(#glow)"/>
  <text x="600" y="205" text-anchor="middle" fill="#a7f3e8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" letter-spacing="5">REACT NATIVE • TYPESCRIPT • EXPO</text>
  <text x="600" y="254" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2">BUILDING MOBILE EXPERIENCES THAT FEEL NATIVE</text>
</svg>
